<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Color Palette Picker</h1>
    <div class="container">
        <div class="left">
            <div class="circle c1" id="Red"></div>
            <div class="circle c2" id="Pink"></div>
            <div class="circle c3" id="Purple"></div>
            <div class="circle c4" id="Indianred"></div>
            <div class="circle c5" id="Blue"></div>
            <div class="circle c6" id="Cyan"></div>
            <div class="circle c7" id="Green"></div>
            <div class="circle c8" id="Teal"></div>
            <div class="circle c9" id="Yellow"></div>
            <div class="circle c10" id="Orange"></div>
        </div>
        <div class="right">
            <div id="pro">Red</div>
            <div class="row">
                <span>50</span>
                <span>#E8EAF6</span>
            </div>
            <div class="row">
                <span>100</span>
                <span>#E8EAF6</span>
            </div>
            <div class="row">
                <span>200</span>
                <span>#E8EAF6</span>
            </div>
            <div class="row">
                <span>300</span>
                <span>#E8EAF6</span>
            </div>
            <div class="row">
                <span>400</span>
                <span>#E8EAF6</span>
            </div>
            <div class="row">
                <span>500</span>
                <span>#E8EAF6</span>
            </div>
            <div class="row">
                <span>600</span>
                <span>#E8EAF6</span>
            </div>
            <div class="row">
                <span>700</span>
                <span>#E8EAF6</span>
            </div>
            <div class="row">
                <span>800</span>
                <span>#E8EAF6</span>
            </div>
        </div>
    </div>
    <script src="jscript.js"></script>
</body>
</html>
